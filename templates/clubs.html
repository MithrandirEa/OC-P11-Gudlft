<html lang="en">
<body>
    <h2>Tableau des points des clubs</h2>
    <table>
        <thead>
            <tr><th>Club</th><th>Points</th></tr>
        </thead>
        <tbody>
            {% for club in clubs %}
            <tr>
                <td>{{ club['name'] }}</td>
                <td>{{ club['points'] }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <a href="{{ url_for('index') }}">Retour à l'accueil</a>
</body>
</html>
